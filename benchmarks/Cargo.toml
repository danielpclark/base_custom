# Benchmarks comparing base_custom 0.2.0 (from crates.io) with this checkout.
#
# A separate package so Criterion, which needs a much newer Rust than the
# library's minimum supported Rust (1.30), never becomes a dependency of `base_custom` itself.
#
#   cd benchmarks && cargo bench
#   python3 report.py > RESULTS.md
[package]
name = "base_custom-benchmarks"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
criterion = "0.8"
base_custom = { path = ".." }
base_custom_v020 = { package = "base_custom", version = "=0.2.0" }

[[bench]]
name = "compare"
harness = false
